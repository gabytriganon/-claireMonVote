name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  # Chaque lundi : photos re-téléchargées, liens sources vérifiés, site republié.
  schedule:
    - cron: '0 5 * * 1'
  # Bouton « Run workflow » dans l'onglet Actions pour relancer une mise à jour à la demande.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Récupérer les photos sous licence libre
        run: node scripts/fetch-photos.mjs
      - name: Vérifier les liens sources
        run: node scripts/check-sources.mjs
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      # GitHub Pages ne connaît pas les routes de l'app : 404.html renvoie vers l'app pour les liens directs.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
