name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  # Chaque lundi : photos re-téléchargées, liens sources vérifiés, site republié.
  schedule:
    - cron: '0 5 * * 1'
  # Bouton « Run workflow » dans l'onglet Actions pour relancer une mise à jour à la demande.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Récupérer les photos sous licence libre
        run: node scripts/fetch-photos.mjs
      - name: Vérifier les liens sources
        run: node scripts/check-sources.mjs
      # Une page HTML par route est générée (référencement), plus sitemap.xml, robots.txt et 404.html.
      # Variables facultatives (Settings > Secrets and variables > Actions > Variables) :
      # SITE_URL (domaine propre, ex. https://eclairemonvote.fr/), GOOGLE_SITE_VERIFICATION, ANDROID_PACKAGE_ID, ANDROID_CERT_SHA256.
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          ANDROID_PACKAGE_ID: ${{ vars.ANDROID_PACKAGE_ID }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
