name: Vérifier

on:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Récupérer les photos sous licence libre
        run: node scripts/fetch-photos.mjs
      - name: Vérifier les liens sources
        run: node scripts/check-sources.mjs
      - run: npm run build
